[project]
name = "adaptive-form-agent"
version = "0.1.0"
description = "Python Deep Agents backend for the Adaptive Form Guide"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "copilotkit>=0.1.96",
    "deepagents>=0.7.32",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-openai>=1.7.2",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "rapidfuzz>=3.14",
    "tree-sitter>=0.25.2",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
adaptive-form-agent = "adaptive_form_agent.api:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
